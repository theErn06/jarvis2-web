<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
    />
    <title>Jarvis Smart Fridge - Terminal</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <style>
      /* Overrides standard 100vh to use dynamic viewport height for mobile browsers */
      body,
      html {
        height: 100dvh !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      /* Pushes the chat bar up to clear iOS/Android bottom swipe bars */
      .chat-controls {
        padding-bottom: max(25px, env(safe-area-inset-bottom)) !important;
      }
    </style>
  </head>
  <body style="background: #f0f2f5">
    <div
      style="
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      "
    >
      <div
        style="
          background: #fff;
          padding: 10px 20px;
          display: flex;
          align-items: center;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
          z-index: 10;
        "
      >
        <button
          onclick="goBack()"
          style="
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
          "
        >
          <span style="font-size: 16px">←</span> Go Back
        </button>
        <h3 style="margin: 0 0 0 15px; color: #2c3e50">Jarvis Direct Link</h3>
      </div>

      <div class="jarvis-wrapper" style="flex: 1; min-height: 0; padding: 15px">
        <div class="chat-container">
          <div class="chat-history" id="chat-history">
            <div class="chat-msg bot-msg">
              <img
                src="jarvis-icon.jpg"
                class="chat-avatar"
                onerror="this.style.display = 'none'"
              />
              <div class="msg-content">
                <div class="msg-label" style="color: #666">JARVIS</div>
                Direct local connection established. Ready for commands!
              </div>
            </div>
          </div>

          <form
            id="chat-form"
            class="chat-controls"
            onsubmit="
              event.preventDefault();
              sendText();
            "
          >
            <input
              type="text"
              id="chat-input"
              placeholder="Message Jarvis..."
              autocomplete="off"
            />

            <button
              type="button"
              class="icon-btn mic-btn"
              id="mic-btn"
              onclick="startVoice()"
            >
              <svg
                viewBox="0 0 24 24"
                width="22"
                height="22"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"
                ></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>

            <button type="submit" class="icon-btn send-btn" id="send-btn">
              <svg
                viewBox="0 0 24 24"
                width="22"
                height="22"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="margin-right: 2px; margin-top: 2px"
              >
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="jarvis.js"></script>
    <script>
      function goBack() {
        // Closes the direct IP tab and returns to the GitHub tab below it
        window.close();

        // Failsafe redirect if the browser blocks window.close()
        setTimeout(() => {
          window.location.href = "inventory.html";
        }, 150);
      }
    </script>
  </body>
</html>
