<!doctype html>
<html>
  <head>
    <title>Jarvis Smart Fridge - Command Center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="dashboard-wrapper">
      <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Jarvis OS</div>
        <div class="sidebar-menu">
          <a class="nav-link" href="inventory.html">📦 Inventory</a>
          <a class="nav-link" href="summary.html">📊 Summary</a>
          <a class="nav-link" href="guide.html">📖 Guide</a>
          <a class="nav-link" href="about.html">👨‍💻 About Us</a>
          <a class="nav-link active" href="jarvis.html">🤖 Jarvis</a>
        </div>
      </div>

      <div class="main-content">
        <div class="topbar">
          <div class="topbar-left">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <h2 class="topbar-title" id="page-title">Jarvis Remote Console</h2>
          </div>
          <button class="danger-btn" onclick="logout()">Logout</button>
        </div>

        <div class="content-container">
          <div
            class="dashboard-view"
            style="
              padding: 0;
              border: none;
              box-shadow: none;
              background: transparent;
            "
          >
            <div class="chat-wrapper">
              <div class="chat-history" id="chat-history">
                <div class="chat-msg bot-msg" style="align-self: flex-start">
                  <div class="msg-content">
                    <div class="msg-label" style="color: #666">JARVIS</div>
                    System online. Connected to the local network. I am ready
                    for your commands.
                  </div>
                </div>
              </div>
              <div class="chat-controls">
                <input
                  type="text"
                  id="chat-input"
                  placeholder="Type a command (e.g. Add two apples)..."
                />
                <button
                  class="icon-btn mic-btn"
                  id="mic-btn"
                  onclick="startVoice()"
                  title="Speak Command"
                >
                  🎤
                </button>
                <button
                  class="icon-btn send-btn"
                  id="send-btn"
                  onclick="sendText()"
                  title="Send"
                >
                  ➤
                </button>
              </div>
            </div>
          </div>
        </div>

        <div
          style="
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 14px;
            margin-top: auto;
          "
        >
          Version 4
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="jarvis.js"></script>
    <script>
      let currentUser = sessionStorage.getItem("currentUser");
      if (!currentUser) window.location.href = "index.html";
      function toggleSidebar() {
        $("#sidebar, .sidebar-overlay").toggleClass("open");
      }
      function logout() {
        sessionStorage.clear();
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
