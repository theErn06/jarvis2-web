<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <title>Jarvis Smart Fridge - Jarvis</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  </head>
  <body>
    <div id="dashboard-wrapper">
      <div class="sidebar-overlay" onclick="toggleMenu()"></div>

      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo-area">
            <div class="header-icon">❄️</div>
            <span class="header-text">Jarvis OS</span>
          </div>
          <button class="close-btn" onclick="toggleMenu()">×</button>
        </div>
        <div class="nav-links">
          <a class="nav-item" href="inventory.html"
            ><div class="icon-box">📦</div>
            <span class="nav-text">Inventory</span></a
          >
          <a class="nav-item" href="summary.html"
            ><div class="icon-box">📊</div>
            <span class="nav-text">Summary</span></a
          >
          <a class="nav-item" href="guide.html"
            ><div class="icon-box">📖</div>
            <span class="nav-text">Guide</span></a
          >
          <a class="nav-item" href="about.html"
            ><div class="icon-box">👨‍💻</div>
            <span class="nav-text">About Us</span></a
          >
          <a class="nav-item active" href="jarvis.html"
            ><div class="icon-box">🤖</div>
            <span class="nav-text">Jarvis</span></a
          >
        </div>
        <div class="bottom-section" id="logout-section">
          <a class="nav-item logout-item" onclick="logout()"
            ><div class="icon-box">🚪</div>
            <span class="nav-text">Logout</span></a
          >
        </div>
      </div>

      <div class="main-content">
        <div class="mobile-header">
          <button class="menu-btn" onclick="toggleMenu()">☰</button>
          <span class="logo-text">Jarvis OS</span>
        </div>

        <div class="content-wrapper animate-fade-in" style="padding-bottom: 0">
          <h2 class="page-title">Jarvis Command Center</h2>

          <div class="jarvis-wrapper">
            <div class="chat-container">
              <div class="chat-history" id="chat-history">
                <div class="chat-msg bot-msg">
                  <img
                    src="jarvis-icon.jpg"
                    class="chat-avatar"
                    onerror="this.style.display = 'none'"
                  />
                  <div class="msg-content">
                    <div class="msg-label" style="color: #666">JARVIS</div>
                    System online. Connected and ready for your commands!
                  </div>
                </div>
              </div>

              <form
                id="chat-form"
                class="chat-controls"
                onsubmit="
                  event.preventDefault();
                  sendText();
                "
              >
                <input
                  type="text"
                  id="chat-input"
                  placeholder="Message Jarvis..."
                  autocomplete="off"
                />

                <button
                  type="button"
                  class="icon-btn mic-btn"
                  id="mic-btn"
                  onclick="startVoice()"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="22"
                    height="22"
                    stroke="currentColor"
                    stroke-width="2"
                    fill="none"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"
                    ></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                  </svg>
                </button>

                <button type="submit" class="icon-btn send-btn" id="send-btn">
                  <svg
                    viewBox="0 0 24 24"
                    width="22"
                    height="22"
                    stroke="currentColor"
                    stroke-width="2"
                    fill="none"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="margin-right: 2px; margin-top: 2px"
                  >
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
                </button>
              </form>
            </div>
          </div>

          <div class="version-text">Version 4</div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="jarvis.js"></script>

    <script>
      let currentUser = sessionStorage.getItem("currentUser");
      if (!currentUser) window.location.href = "index.html";

      function toggleMenu() {
        $("#sidebar").toggleClass("open");
        $(".sidebar-overlay").toggleClass("open");
      }

      function logout() {
        sessionStorage.clear();
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
