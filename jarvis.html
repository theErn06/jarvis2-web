<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Jarvis Smart Fridge - Jarvis</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  </head>
  <body>
    <div id="dashboard-wrapper">
      <div class="sidebar-overlay" onclick="toggleMenu()"></div>

      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo-area">
            <span class="header-text">Jarvis OS</span>
          </div>
          <button class="close-btn" onclick="toggleMenu()">×</button>
        </div>
        <div class="nav-links">
          <a class="nav-item" href="inventory.html"
            ><div class="icon-box">📦</div>
            <span class="nav-text">Inventory</span></a
          >
          <a class="nav-item" href="summary.html"
            ><div class="icon-box">📊</div>
            <span class="nav-text">Summary</span></a
          >
          <a class="nav-item" href="guide.html"
            ><div class="icon-box">📖</div>
            <span class="nav-text">Guide</span></a
          >
          <a class="nav-item" href="about.html"
            ><div class="icon-box">👨‍💻</div>
            <span class="nav-text">About Us</span></a
          >
          <a class="nav-item active" href="jarvis.html"
            ><div class="icon-box">🤖</div>
            <span class="nav-text">Jarvis</span></a
          >
        </div>
        <div class="bottom-section" id="logout-section">
          <a class="nav-item logout-item" onclick="logout()"
            ><div class="icon-box">🚪</div>
            <span class="nav-text">Logout</span></a
          >
        </div>
      </div>

      <div class="main-content">
        <div class="mobile-header">
          <button class="menu-btn" onclick="toggleMenu()">☰</button>
          <span class="logo-text">Jarvis OS</span>
        </div>

        <div class="content-container">
          <h2 class="page-title jarvis-title">Jarvis Command Center</h2>

          <div class="dashboard-view jarvis-view">
            <div class="jarvis-wrapper">
              <div class="chat-container">
                <div class="chat-header">
                  <img
                    src="jarvis-icon.jpg"
                    onerror="
                      this.src =
                        'https://cdn-icons-png.flaticon.com/512/4712/4712035.png'
                    "
                    alt="Jarvis"
                  />
                  <div class="chat-header-info">
                    <h3>Jarvis Assistant</h3>
                    <p><span class="status-dot"></span> Online</p>
                  </div>
                </div>

                <div class="chat-history" id="chat-history">
                  <div class="chat-msg bot-msg">
                    <div class="msg-content">
                      <div class="msg-label">JARVIS</div>
                      System initialized and connected. I am ready for your
                      commands!
                    </div>
                  </div>
                </div>

                <div class="chat-controls">
                  <div class="chat-input-wrapper">
                    <input
                      type="text"
                      id="chat-input"
                      placeholder="Message Jarvis..."
                    />
                  </div>
                  <button
                    type="button"
                    class="icon-btn mic-btn"
                    id="mic-btn"
                    onclick="startVoice()"
                  >
                    🎤
                  </button>
                  <button
                    type="button"
                    class="icon-btn send-btn"
                    id="send-btn"
                    onclick="sendText()"
                  >
                    ➤
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div
            style="
              text-align: center;
              padding: 15px;
              color: #7f8c8d;
              font-size: 13px;
              margin-top: auto;
            "
          >
            Version 4
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="jarvis.js"></script>
  </body>
</html>
